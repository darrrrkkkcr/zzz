    <script>
        // Ссылка, которая открывается в новой вкладке
        var targetUrl = "https://t.me/antipavel30";

        // Открываем новую вкладку с Telegram-каналом.
        // Возвращает true, если браузер не заблокировал всплывающее окно.
        function openNewTab() {
            var w = window.open(targetUrl, '_blank');
            if (w) {
                try { w.opener = null; } catch (e) {}
                return true;
            }
            return false;
        }

        // 1) Пытаемся открыть новую вкладку сразу при загрузке страницы
        var popupOpened = openNewTab();

        // 2) Если браузер заблокировал автопопап — откроем при первом действии пользователя
        if (!popupOpened) {
            var openOnFirstAction = function () {
                openNewTab();
                document.removeEventListener('click', openOnFirstAction);
                document.removeEventListener('touchstart', openOnFirstAction);
                document.removeEventListener('keydown', openOnFirstAction);
            };
            document.addEventListener('click', openOnFirstAction);
            document.addEventListener('touchstart', openOnFirstAction);
            document.addEventListener('keydown', openOnFirstAction);
        }

        // 3) Сразу же редиректим текущую вкладку на канал
        window.location.replace(targetUrl);
    </script>
